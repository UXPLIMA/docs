            <stop offset="0%" style="stop-color:#2e8b57"/>
            <stop offset="100%" style="stop-color:#228b22"/>
        </linearGradient>
    </defs>
    <!-- Shield base -->
    <path d="M32 4 L56 14 V32 C56 48 32 60 32 60 C32 60 8 48 8 32 V14 L32 4Z"
